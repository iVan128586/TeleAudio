<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <link rel="stylesheet" href="teleau/teleau.css">
    <script src="teleau/teleau.js" defer></script>
</head>
<body style="background-color: black;">
    <div class="teleau-content">
        <div>Настройки голоса</div>
        <div class="voice">
            <div>Голос: <span class="output">100%</span></div>
            <div class="bar">
                <div class="display"></div>
                <input type="range" min="0" max="1" value="1" step="0.0000001">
            </div>
        </div>
        <div class="demo">
            <div>Демка: <span class="output">100%</span></div>
            <div class="bar">
                <div class="display"></div>
                <input type="range" min="0" max="1" value="1" step="0.0000001">
            </div>
        </div>
    </div>
</body>
</html>
